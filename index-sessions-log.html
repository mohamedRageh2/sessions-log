<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل الجلسات النفسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F1E9;
    --deep:#26433D;
    --deep-2:#1B302B;
    --sage:#7C9885;
    --sage-light:#E4EBE3;
    --ink:#22261F;
    --amber:#B98B4E;
    --amber-light:#F3E4CC;
    --white:#FFFFFF;
    --rose:#B5615A;
    --border:#DFD8C8;
  }
  html[data-theme="dark"]{
    --cream:#1B211D;
    --deep:#8FBBA7;
    --deep-2:#C9E4D6;
    --sage:#6FA089;
    --sage-light:#2A342E;
    --ink:#EAE7DF;
    --amber:#D9A867;
    --amber-light:#3A2F1F;
    --white:#242B26;
    --rose:#E08880;
    --border:#3A453E;
  }
  body{ transition: background-color .2s, color .2s; }
  html[data-theme="dark"] .btn-primary{ color:#12201A; }
  html[data-theme="dark"] .login-mark{ color:#12201A; }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }
  input, textarea, select {
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;
    user-select: text;
  }
  h1,h2,h3,.serif{
    font-family:'Markazi Text', serif;
    font-weight:600;
  }
  #app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}

  /* ---------- Login ---------- */
  #login-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 24px; text-align:center; position:relative;
  }
  .login-mark{
    width:56px; height:56px; border-radius:50%;
    background:var(--deep); color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    font-family:'Markazi Text',serif; font-size:28px; font-weight:700;
    margin-bottom:18px;
  }
  #login-screen h1{font-size:30px; color:var(--deep-2); margin:0 0 6px;}
  #login-screen p.sub{color:#5b6459; font-size:14px; margin:0 0 24px; max-width:280px; line-height:1.6;}
  .field{width:100%; text-align:right; margin-bottom:14px;}
  .field label{display:block; font-size:13px; color:#5b6459; margin-bottom:6px;}
  input[type=password], input[type=text], input[type=number], input[type=date], input[type=tel], input[type=email], textarea, select{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--border);
    background:var(--white); font-family:inherit; font-size:15px; color:var(--ink);
    outline:none; transition:border-color .15s;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--sage);}
  textarea{resize:vertical; min-height:70px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:12px 20px; border-radius:10px; border:none; cursor:pointer;
    font-family:inherit; font-size:15px; font-weight:600; transition:opacity .15s, transform .05s;
  }
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.6; cursor:default;}
  .btn-primary{background:var(--deep); color:var(--cream); width:100%;}
  .btn-primary:hover{opacity:.92;}
  .btn-outline{background:transparent; color:var(--deep); border:1.5px solid var(--deep); width:100%; margin-top:10px;}
  .btn-danger{background:transparent; color:var(--rose); border:1.5px solid var(--rose);}
  .btn-ghost{background:transparent; color:#5b6459;}
  .btn-logout{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--rose); color:#ffffff; border:none; border-radius:8px;
    padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer;
    font-family:inherit; transition:opacity .15s, transform .05s;
  }
  .btn-logout:hover{ opacity:.9; }
  .btn-logout:active{ transform:scale(.97); }
  #login-error{color:var(--rose); font-size:13px; min-height:18px; margin-top:4px;}
  #login-info{color:var(--deep); font-size:13px; min-height:18px; margin-top:4px;}
  .hint-note{
    margin-top:22px; font-size:12px; color:#8a8f83; line-height:1.7; max-width:300px;
  }
  .toggle-mode{font-size:13px; color:var(--deep); background:none; border:none; text-decoration:underline; cursor:pointer; margin-top:14px;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:5; background:var(--cream);
    padding:18px 20px 12px; border-bottom:1px solid var(--border);
  }
  header .top-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  header h1{font-size:26px; color:var(--deep-2); margin:0;}
  .icon-btn{
    background:none; border:none; cursor:pointer; font-size:20px; color:#5b6459; padding:6px;
  }
  #search-input{background:var(--white);}
  .search-wrap{position:relative;}
  .search-wrap span{position:absolute; right:14px; top:50%; transform:translateY(-50%); color:#a3a99a; font-size:15px;}
  #search-input{padding-right:36px;}
  .branch-tabs{display:flex; gap:8px; margin-top:12px; overflow-x:auto; padding-bottom:2px;}
  .branch-tab{
    flex-shrink:0; padding:7px 16px; border-radius:20px; border:1.5px solid var(--border);
    background:var(--white); color:#7a8074; font-size:13px; font-weight:600; cursor:pointer;
    font-family:inherit; white-space:nowrap; transition:.15s;
  }
  .branch-tab.active{background:var(--deep); border-color:var(--deep); color:var(--cream);}
  html[data-theme="dark"] .branch-tab.active{color:#12201A;}
  .branch-badge{
    display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px;
    background:var(--amber-light); color:var(--amber); margin-inline-start:6px;
  }

  /* ---------- Patient list ---------- */
  #patient-list{padding:14px 16px 90px; flex:1; overflow-y:auto;}
  .patient-card{
    background:var(--white); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:12px; cursor:pointer; transition:border-color .15s;
    display:flex; justify-content:space-between; align-items:center;
  }
  .patient-card:hover{border-color:var(--sage);}
  .patient-card .pname{font-size:18px; font-weight:600; color:var(--deep-2);}
  .patient-card .pmeta{font-size:13px; color:#7a8074; margin-top:4px;}
  .patient-card .pchev{color:#c3c9b8; font-size:18px;}
  .badge{
    display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px;
    background:var(--sage-light); color:var(--deep); margin-inline-start:6px;
  }
  .badge.inactive{background:#EFE9E1; color:#8a8f83;}
  .empty-state{
    text-align:center; padding:60px 20px; color:#8a8f83;
  }
  .empty-state .em-mark{font-size:38px; margin-bottom:12px;}
  .fab{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    max-width:520px; width:calc(100% - 32px);
  }
  .fab-inner{max-width:520px; margin:0 auto; padding:0 16px;}

  /* ---------- Detail / forms screens ---------- */
  .screen{position:absolute; inset:0; background:var(--cream); display:flex; flex-direction:column; overflow-y:auto; z-index:20;}
  .screen-header{
    position:sticky; top:0; background:var(--cream); padding:16px 16px 10px;
    display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); z-index:2;
  }
  .screen-header h2{margin:0; font-size:22px; color:var(--deep-2); flex:1;}
  .screen-body{padding:16px; padding-bottom:60px;}

  .info-card{background:var(--white); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px;}
  .info-row{display:flex; justify-content:space-between; padding:7px 0; font-size:14px; border-bottom:1px dashed var(--border);}
  .info-row:last-child{border-bottom:none;}
  .info-row .k{color:#7a8074;}
  .info-row .v{font-weight:600; color:var(--ink);}

  .section-title{display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px;}
  .section-title h3{margin:0; font-size:18px; color:var(--deep-2);}
  .add-link{font-size:13px; color:var(--deep); background:var(--sage-light); padding:6px 12px; border-radius:20px; border:none; cursor:pointer; font-weight:600;}

  .item-card{background:var(--white); border:1px solid var(--border); border-radius:12px; padding:13px 14px; margin-bottom:10px;}
  .item-card .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .item-card .item-date{font-size:12px; color:#8a8f83; margin-bottom:4px;}
  .item-card .item-text{font-size:14.5px; line-height:1.6;}
  .item-card .item-actions{display:flex; gap:6px; margin-top:8px;}
  .mini-btn{font-size:12px; padding:4px 10px; border-radius:8px; border:1px solid var(--border); background:var(--white); cursor:pointer; color:#5b6459;}
  .task-check{
    width:20px; height:20px; border-radius:6px; border:1.5px solid var(--sage); background:var(--white);
    cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--deep);
  }
  .task-row{display:flex; gap:10px; align-items:flex-start;}
  .task-row .task-body{flex:1;}
  .task-row.done .task-body .item-text{text-decoration:line-through; color:#a3a99a;}

  form .field{margin-bottom:12px;}
  .form-actions{display:flex; gap:10px; margin-top:18px;}
  .form-actions .btn{flex:1;}

  .loading{text-align:center; padding:40px; color:#8a8f83;}
  .sync-badge{font-size:11px; color:#8a8f83; text-align:center; padding:4px 0;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;}
  .stat-card{background:var(--white); border:1px solid var(--border); border-radius:14px; padding:16px; text-align:center;}
  .stat-card .stat-num{font-family:'Markazi Text',serif; font-size:32px; font-weight:700; color:var(--deep-2);}
  .stat-card .stat-label{font-size:12.5px; color:#7a8074; margin-top:2px;}
  .branch-breakdown-row{display:flex; justify-content:space-between; padding:8px 0; font-size:14px; border-bottom:1px dashed var(--border);}
  .branch-breakdown-row:last-child{border-bottom:none;}
  #folder-view{padding:20px 16px; flex:1;}
  #folder-view h2{font-size:24px; color:var(--deep-2); margin:6px 0 4px; text-align:center;}
  #folder-view p.sub{color:#7a8074; font-size:13.5px; text-align:center; margin:0 0 24px;}
  .folder-card{
    background:var(--white); border:1.5px solid var(--border); border-radius:16px;
    padding:20px; margin-bottom:14px; display:flex; align-items:center; gap:14px;
    cursor:pointer; transition:border-color .15s, transform .05s;
  }
  .folder-card:active{transform:scale(.98);}
  .folder-card:hover{border-color:var(--sage);}
  .folder-card .folder-icon{
    width:48px; height:48px; border-radius:12px; background:var(--sage-light);
    display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0;
  }
  .folder-card .folder-name{font-size:19px; font-weight:600; color:var(--deep-2);}
  .folder-card .folder-count{font-size:13px; color:#8a8f83; margin-top:2px;}
  .folder-card.all-folder .folder-icon{background:var(--amber-light);}
  .folder-card.add-folder{border-style:dashed; background:transparent;}
  .folder-card.add-folder .folder-icon{background:transparent; border:1.5px dashed var(--sage);}
  .list-back-row{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .list-back-row button{font-size:13px; color:var(--deep); background:none; border:none; cursor:pointer; font-weight:600; display:flex; align-items:center; gap:4px;}
  .undo-toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    max-width:460px; width:calc(100% - 32px);
    background:var(--deep-2); color:var(--cream); border-radius:12px;
    padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
    gap:12px; font-size:14px; z-index:20; box-shadow:0 4px 16px rgba(0,0,0,.2);
    animation:slideUp .2s ease-out;
  }
  html[data-theme="dark"] .undo-toast{ background:#3A453E; color:#EAE7DF; }
  .undo-toast button{background:none; border:none; color:var(--amber); font-weight:700; cursor:pointer; font-size:14px; flex-shrink:0;}
  @keyframes slideUp{ from{opacity:0; transform:translate(-50%, 10px);} to{opacity:1; transform:translate(-50%, 0);} }
  .conflict-banner{
    background:var(--amber-light); border:1.5px solid var(--amber); border-radius:12px;
    padding:12px 14px; margin-bottom:14px; font-size:13.5px; line-height:1.7; color:var(--ink);
  }
  .conflict-banner strong{color:var(--amber);}
  ::placeholder{color:#b3b8a6;}
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div style="position:absolute; top:16px; left:16px; display:flex; gap:6px; align-items:center;">
      <button class="icon-btn" id="theme-toggle-login" style="font-size:22px;">🌙</button>
      <button class="icon-btn" id="lang-toggle-login" title="تبديل اللغة / Switch Language" style="font-size:12px; font-weight:700; background:var(--sage-light); border-radius:8px; padding:4px 8px; color:var(--deep);">EN</button>
    </div>
    <div class="login-mark">ن</div>
    <h1 id="login-title">تسجيل الدخول</h1>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="email-input" placeholder="example@email.com" autocomplete="username">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="password-input" placeholder="اكتبي كلمة المرور" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="login-btn">دخول</button>
    <button class="toggle-mode" id="forgot-pw-btn">نسيت كلمة المرور؟</button>
    <div id="login-error"></div>
    <div id="login-info"></div>
  </div>

  <!-- MAIN APP (hidden until login) -->
  <div id="main-app" style="display:none; flex-direction:column; position:relative; flex:1;">
    <header>
      <div class="top-row">
        <h1 id="main-header-title">سجل الجلسات النفسية</h1>
        <div style="display:flex; align-items:center; gap:6px;">
          <button class="icon-btn" id="lang-toggle-main" title="تبديل اللغة / Switch Language" style="font-size:12px; font-weight:700; background:var(--sage-light); border-radius:8px; padding:4px 8px; color:var(--deep);">EN</button>
          <button class="icon-btn" id="report-btn" title="التقرير الشهري">📊</button>
          <button class="icon-btn" id="theme-toggle-main" title="الوضع الليلي/النهاري">🌙</button>
          <button class="icon-btn" id="export-btn" title="تصدير نسخة احتياطية CSV">⬇️</button>
          <button class="icon-btn" id="lock-btn" title="تسجيل الخروج">🚪</button>
        </div>
      </div>
      <div id="user-info-bar" style="display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:#5b6459; padding-top:4px; margin-bottom:4px; border-top:1px dashed var(--border);">
        <span>الحساب المسجل: <strong id="logged-in-user-email" style="color:var(--deep); font-weight:600;">—</strong></span>
      </div>
      <div id="list-header-controls" style="display:none;">
        <div class="list-back-row" style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <button id="back-to-folders-btn" class="icon-btn" title="رجوع للأقسام" style="background:var(--sage-light); border-radius:10px; width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; font-size:18px; color:var(--deep-2);">→</button>
        </div>
        <div class="search-wrap">
          <input type="text" id="search-input" placeholder="ابحثي بالاسم أو التليفون أو سبب المتابعة...">
          <span>⚲</span>
        </div>
      </div>
    </header>

    <div id="folder-view">
      <h2>اختاري القسم</h2>
      <div id="folder-cards"></div>
    </div>

    <div id="patient-list" style="display:none;"></div>

    <div class="fab" id="add-patient-fab" style="display:none;">
      <div class="fab-inner">
        <button class="btn btn-primary" id="add-patient-btn" style="width:100%;">+ إضافة حالة جديدة</button>
      </div>
    </div>

    <div class="screen" id="detail-screen" style="display:none;"></div>
    <div class="screen" id="patient-form-screen" style="display:none;"></div>
    <div class="screen" id="item-form-screen" style="display:none;"></div>
    <div class="screen" id="report-screen" style="display:none;"></div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword,
    onAuthStateChanged, signOut, sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import {
    getFirestore, collection, doc, setDoc, addDoc, getDocs, getDoc,
    updateDoc, deleteDoc, query
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCFTIOWcMhrwRuz8f9tCv5AYXENI9v0lIg",
    authDomain: "customers-db-76b73.firebaseapp.com",
    projectId: "customers-db-76b73",
    storageBucket: "customers-db-76b73.firebasestorage.app",
    messagingSenderId: "850923423490",
    appId: "1:850923423490:web:84e5d777e6c1d2741d641b"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);
  // ---------- Protection & Anti-Copy ----------
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (
      e.keyCode === 123 ||
      (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
      (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))
    ) {
      e.preventDefault();
      return false;
    }
  });

  // ---------- Utilities ----------
  function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(d){
    if(!d) return '—';
    try{ const dt = new Date(d); return dt.toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'}); }
    catch(e){ return d; }
  }
  let undoTimers = {};
  function showUndoToast(message, onUndo, onCommit, delayMs){
    const id = 'undo_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
    const toast = document.createElement('div');
    toast.className = 'undo-toast';
    toast.id = id;
    toast.innerHTML = `<span>${esc(message)}</span><button>تراجع</button>`;
    document.body.appendChild(toast);
    const timer = setTimeout(() => {
      const el = document.getElementById(id);
      if(el) el.remove();
      delete undoTimers[id];
      onCommit();
    }, delayMs || 4000);
    undoTimers[id] = timer;
    toast.querySelector('button').addEventListener('click', () => {
      clearTimeout(undoTimers[id]);
      delete undoTimers[id];
      toast.remove();
      onUndo();
    });
  }

  function friendlyAuthError(code){
    const map = {
      'auth/invalid-email': 'صيغة البريد الإلكتروني غير صحيحة.',
      'auth/user-not-found': 'كلمة المرور غير صحيحة أو الحساب غير موجود.',
      'auth/wrong-password': 'كلمة المرور غير صحيحة.',
      'auth/invalid-credential': 'كلمة المرور غير صحيحة.',
      'auth/email-already-in-use': 'هذا البريد مسجل بالفعل، أدخلي كلمة المرور الصحيحة.',
      'auth/weak-password': 'كلمة المرور يجب أن تكون 6 أرقام/حروف على الأقل.',
      'auth/too-many-requests': 'محاولات كثيرة خاطئة، يرجى الانتظار قليلاً والمحاولة مجدداً.',
      'auth/network-request-failed': 'تأكدي من الاتصال بالإنترنت وحاولي مرة أخرى.'
    };
    return map[code] || ('حصل خطأ: ' + (code || 'حاولي تاني'));
  }

  // ---------- Theme (dark/light mode) ----------
  const THEME_KEY = 'clinic_records_theme';
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    const icon = theme === 'dark' ? '☀️' : '🌙';
    const t1 = document.getElementById('theme-toggle-login');
    const t2 = document.getElementById('theme-toggle-main');
    if(t1) t1.textContent = icon;
    if(t2) t2.textContent = icon;
  }
  function getSavedTheme(){
    try{ return window.localStorage.getItem(THEME_KEY) || 'light'; }catch(e){ return 'light'; }
  }
  function toggleTheme(){
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try{ window.localStorage.setItem(THEME_KEY, next); }catch(e){ /* ignore */ }
  }
  applyTheme(getSavedTheme());
  document.getElementById('theme-toggle-login').addEventListener('click', toggleTheme);
  document.getElementById('theme-toggle-main').addEventListener('click', toggleTheme);

  async function getSessions(patientId){

    try{
      const snap = await getDocs(sessionsCol(patientId));
      sessionsCache[patientId] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }catch(e){ console.error('getSessions failed', e); sessionsCache[patientId] = []; }
    return sessionsCache[patientId];
  }

      patientListEl.innerHTML = `<div class="empty-state"><div class="em-mark">🗂</div>سجل الجلسات النفسية لسه فاضي.<br>ابدئي بإضافة أول حالة.</div>`;

      for(const p of patients){
        rows.push(['حالة', p.branch||'', p.name||'', p.age||'', p.gender||'', p.phone||'', p.startDate||'', p.reason||'', p.active===false?'متوقفة':'نشطة', '', p.notes||'']);

  async function computeAndRenderReport(monthValue){
    const bodyEl = document.getElementById('report-body');
    bodyEl.innerHTML = '<div class="loading">جاري الحساب...</div>';

    const [year, month] = monthValue.split('-').map(Number);
    const patientIdsSeen = new Set();
    let totalSessions = 0;
    let totalCollected = 0;
    let totalExpected = 0;
    const branchCounts = {};

    for(const p of patients){
      const sessions = await getSessions(p.id);
      const monthSessions = sessions.filter(s => {
        if(!s.date) return false;
        const d = new Date(s.date);
        return d.getFullYear() === year && (d.getMonth()+1) === month;
      });
      if(monthSessions.length > 0){
        patientIdsSeen.add(p.id);
        totalSessions += monthSessions.length;
        const branchKey = p.branch || 'غير محدد';
        branchCounts[branchKey] = (branchCounts[branchKey] || 0) + monthSessions.length;
        monthSessions.forEach(s => {
          const amt = parseFloat(s.amount) || 0;
          totalExpected += amt;
          if(s.paid) totalCollected += amt;
        });
      }
    }

    const monthLabel = new Date(year, month-1, 1).toLocaleDateString('ar-EG', { year:'numeric', month:'long' });

    bodyEl.innerHTML = `
      <p style="text-align:center; color:#7a8074; font-size:13px; margin:12px 0 18px;">إحصائيات شهر ${monthLabel}</p>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-num">${patientIdsSeen.size}</div>
          <div class="stat-label">حالة اتشتغل معاها</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${totalSessions}</div>
          <div class="stat-label">إجمالي عدد الجلسات</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${totalCollected.toLocaleString('ar-EG')}</div>
          <div class="stat-label">إجمالي المحصّل (جنيه)</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${totalExpected.toLocaleString('ar-EG')}</div>
          <div class="stat-label">إجمالي المتوقع (جنيه)</div>
        </div>
      </div>
      ${Object.keys(branchCounts).length > 0 ? `
        <div class="info-card">
          <div style="font-weight:600; margin-bottom:8px; color:var(--deep-2);">توزيع الجلسات حسب القسم</div>
          ${Object.entries(branchCounts).map(([b,c]) => `
            <div class="branch-breakdown-row"><span class="k">${esc(b)}</span><span class="v">${c} جلسة</span></div>

      <p style="text-align:center; color:#8a8f83; font-size:12px; margin-top:14px;">التقرير بيتحسب تلقائيًا من تواريخ الجلسات، فكل شهر جديد بيبدأ حسابه من نفسه من غير ما تعملي حاجة.</p>
    `;
  }

  // ---------- Patient detail screen ----------
  const detailScreen = document.getElementById('detail-screen');

  async function openPatientDetail(patientId){
    const p = patients.find(x => x.id === patientId);
    if(!p) return;
    detailScreen.style.display = 'flex';
    detailScreen.innerHTML = `<div class="loading">جاري التحميل...</div>`;

    const [sessions, tasks, assessments] = await Promise.all([getSessions(patientId), getTasks(patientId), getAssessments(patientId)]);
    const sortedSessions = [...sessions].sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
    const sortedTasks = [...tasks].sort((a,b) => (a.status==='done') - (b.status==='done') || new Date(b.assignedDate||0) - new Date(a.assignedDate||0));
    const sortedAssessments = [...assessments].sort((a,b) => new Date(b.date||0) - new Date(a.date||0));

    detailScreen.innerHTML = `
      <div class="screen-header">
        <button class="icon-btn" id="back-from-detail">→</button>
        <h2>${esc(p.name)}</h2>
        <button class="icon-btn" id="edit-patient-btn">✎</button>
      </div>
      <div class="screen-body">
        <div class="info-card">
          <div class="info-row"><span class="k">القسم</span><span class="v">${p.branch ? esc(p.branch) : '—'} <button class="mini-btn" id="change-branch-btn" style="margin-inline-start:8px;">تغيير</button></span></div>
          <div id="branch-change-box" style="display:none; margin:10px 0; padding:10px; background:var(--sage-light); border-radius:10px;">
            <select id="new-branch-select" style="margin-bottom:8px;">
              ${buildBranchOptionsHtml(p.branch)}
            </select>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-primary" id="confirm-branch-change" style="flex:1; padding:8px;">تأكيد النقل</button>
              <button class="btn btn-ghost" id="cancel-branch-change" style="flex:1; padding:8px;">إلغاء</button>
            </div>
          </div>
          <div class="info-row"><span class="k">العمر</span><span class="v">${esc(p.age)||'—'}</span></div>
          <div class="info-row"><span class="k">الجنس</span><span class="v">${esc(p.gender)||'—'}</span></div>
          <div class="info-row"><span class="k">رقم التليفون</span><span class="v">${esc(p.phone)||'—'}</span></div>
          <div class="info-row"><span class="k">تاريخ أول جلسة</span><span class="v">${fmtDate(p.startDate)}</span></div>
          <div class="info-row"><span class="k">سبب المتابعة</span><span class="v">${esc(p.reason)||'—'}</span></div>
          <div class="info-row"><span class="k">الحالة</span><span class="v">${p.active===false?'متوقفة':'نشطة'}</span></div>
          ${p.notes ? `<div class="info-row"><span class="k">ملاحظات</span><span class="v">${esc(p.notes)}</span></div>` : ''}
        </div>

        <div class="section-title">
          <h3>الجلسات (${sortedSessions.length})</h3>
          <button class="add-link" id="add-session-btn">+ جلسة جديدة</button>
        </div>
        <div id="sessions-list">
          ${sortedSessions.length === 0 ? '<div class="empty-state" style="padding:24px 0;">لسه مفيش جلسات مسجلة.</div>' :
            sortedSessions.map(s => `
              <div class="item-card">
                <div class="item-top">
                  <div>
                    <div class="item-date">${fmtDate(s.date)} ${s.duration ? '· ' + esc(s.duration) + ' دقيقة' : ''} ${s.type ? '· ' + esc(s.type) : ''} ${s.amount ? '· ' + esc(s.amount) + ' جنيه' : ''} <span class="badge ${s.paid ? '' : 'inactive'}" style="margin-inline-start:4px;">${s.paid ? 'مدفوعة' : 'غير مدفوعة'}</span></div>
                    <div class="item-text">${esc(s.notes) || '—'}</div>
                  </div>
                </div>
                <div class="item-actions">
                  <button class="mini-btn" data-del-session="${s.id}">حذف</button>
                </div>
              </div>
            `).join('')
          }
        </div>

        <div class="section-title">
          <h3>التاسكات (${sortedTasks.length})</h3>
          <button class="add-link" id="add-task-btn">+ تاسك جديد</button>
        </div>
        <div id="tasks-list">
          ${sortedTasks.length === 0 ? '<div class="empty-state" style="padding:24px 0;">لسه مفيش تاسكات.</div>' :
            sortedTasks.map(t => `
              <div class="item-card task-row ${t.status==='done'?'done':''}">
                <button class="task-check" data-toggle-task="${t.id}">${t.status==='done' ? '✓' : ''}</button>
                <div class="task-body">
                  <div class="item-date">${t.assignedDate ? 'من ' + fmtDate(t.assignedDate) : ''} ${t.dueDate ? '· مطلوب: ' + fmtDate(t.dueDate) : ''} ${t.sessionId ? '· 🔗 مرتبط بجلسة ' + fmtDate((sessions.find(s=>s.id===t.sessionId)||{}).date) : ''}</div>
                  <div class="item-text">${esc(t.description)}</div>
                  <div class="item-actions">
                    <button class="mini-btn" data-del-task="${t.id}">حذف</button>
                  </div>
                </div>
              </div>
            `).join('')
          }
        </div>

        <div class="section-title">
          <h3>التقارير الطبية والمستندات (PDF / صور)</h3>
        </div>
        <div class="info-card" style="padding:12px 16px;">
          ${[
            { key: 'final', label: currentLang === 'en' ? 'Final Report' : 'التقرير النهائي' },
            { key: 'doctor', label: currentLang === 'en' ? 'Attending Physician Report' : 'تقرير الطبيب المعالج' },
            { key: 'scales', label: currentLang === 'en' ? 'Applied Scales Report' : 'تقرير المقاييس المطبقة' }
          ].map(rt => {
            const fileData = (p.reports || {})[rt.key];
            return `
              <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; padding:10px 0; border-bottom:1px dashed var(--border);">
                <div>
                  <div style="font-weight:600; font-size:14px; color:var(--deep-2);">${rt.label}</div>
                  <div style="font-size:12px; color:#7a8074; margin-top:2px;">
                    ${fileData ? `✓ ${esc(fileData.name || 'ملف مرفق')} · ${fmtDate(fileData.date)}` : 'لم يتم إرفاق تقرير بعد'}
                  </div>
                </div>
                <div style="display:flex; align-items:center; gap:6px;">
                  ${fileData ? `
                    <button class="mini-btn" data-view-report="${rt.key}" style="background:var(--sage-light); color:var(--deep); font-weight:600;">👁️ فتح</button>
                    <button class="mini-btn" data-del-report="${rt.key}" style="color:var(--rose);">🗑️ حذف</button>
                  ` : `
                    <label class="mini-btn" style="cursor:pointer; background:var(--sage-light); color:var(--deep); font-weight:600; display:inline-flex; align-items:center; gap:4px; margin:0;">
                      📷/📄 رفع / تصوير
                      <input type="file" data-upload-report="${rt.key}" accept="application/pdf,image/*" style="display:none;">
                    </label>
                  `}
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="section-title">
          <h3>المقاييس النفسية (${sortedAssessments.length})</h3>
          <button class="add-link" id="add-assessment-btn">+ مقياس جديد</button>
        </div>
        <div id="assessments-list">
          ${sortedAssessments.length === 0 ? '<div class="empty-state" style="padding:24px 0;">لسه مفيش مقاييس مسجلة.</div>' :
            sortedAssessments.map(a => `
              <div class="item-card">
                <div class="item-top">
                  <div>
                    <div class="item-date">${fmtDate(a.date)} · ${esc(a.name)}</div>
                    <div class="item-text">النتيجة: ${esc(a.score)} ${a.notes ? '— ' + esc(a.notes) : ''}</div>
                  </div>
                </div>
                <div class="item-actions">
                  <button class="mini-btn" data-del-assessment="${a.id}">حذف</button>
                </div>
              </div>
            `).join('')
          }
        </div>
      </div>
    `;

    // File Upload Handlers for 3 Reports
    detailScreen.querySelectorAll('[data-upload-report]').forEach(input => {
      input.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        if(file.size > 8 * 1024 * 1024){
          alert('حجم الملف كبير جداً، يرجى اختيار صورة أو مستند أقل من 8 ميجابايت.');
          return;
        }
        const reportKey = input.dataset.uploadReport;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          const dataUrl = evt.target.result;
          if(!p.reports) p.reports = {};
          p.reports[reportKey] = {
            name: file.name,
            type: file.type,
            date: new Date().toISOString().slice(0,10),
            data: dataUrl
          };
          try {
            await setDoc(doc(patientsCol(), patientId), { reports: p.reports }, { merge: true });
            openPatientDetail(patientId);
          } catch(err) {
            console.error(err);
            alert('حصل خطأ في حفظ المستند.');
          }
        };
        reader.readAsDataURL(file);
      });
    });

    // File View Handlers for 3 Reports
    detailScreen.querySelectorAll('[data-view-report]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.viewReport;
        const rep = (p.reports || {})[key];
        if(!rep || !rep.data) return;
        const win = window.open();
        if(win){
          if(rep.type === 'application/pdf' || rep.data.startsWith('data:application/pdf')){
            win.document.write(`<title>${esc(rep.name)}</title><iframe src="${rep.data}" frameborder="0" style="position:fixed; top:0; left:0; width:100%; height:100%; border:none;"></iframe>`);
          } else {
            win.document.write(`<title>${esc(rep.name)}</title><img src="${rep.data}" style="max-width:100%; height:auto; display:block; margin:20px auto;">`);
          }
        }
      });
    });

    // File Delete Handlers for 3 Reports
    detailScreen.querySelectorAll('[data-del-report]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(!confirm('هل تريد حذف هذا المستند المرفق؟')) return;
        const key = btn.dataset.delReport;
        if(p.reports && p.reports[key]){
          delete p.reports[key];
          try {
            await setDoc(doc(patientsCol(), patientId), { reports: p.reports }, { merge: true });
            openPatientDetail(patientId);
          } catch(err) {
            console.error(err);
            alert('حصل خطأ أثناء الحذف.');
          }
        }
      });
    });

    document.getElementById('add-assessment-btn').addEventListener('click', () => openItemForm('assessment', patientId));
    detailScreen.querySelectorAll('[data-del-assessment]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.delAssessment;
        const item = assessmentsCache[patientId].find(a => a.id === id);
        assessmentsCache[patientId] = assessmentsCache[patientId].filter(a => a.id !== id);
        openPatientDetail(patientId);
        showUndoToast('اتحذف المقياس', () => {
          assessmentsCache[patientId].push(item);
          openPatientDetail(patientId);
        }, async () => {
          try{ await deleteDoc(doc(assessmentsCol(patientId), id)); }
          catch(e){ console.error(e); alert('حصل خطأ أثناء الحذف الفعلي، ممكن المقياس يرجع يظهر تاني.'); }
        });
      });
    });

    document.getElementById('back-from-detail').addEventListener('click', () => {
      detailScreen.style.display = 'none';
      renderPatientList();
    });
    document.getElementById('edit-patient-btn').addEventListener('click', () => openPatientForm(p));
    document.getElementById('change-branch-btn').addEventListener('click', () => {
      document.getElementById('branch-change-box').style.display = 'block';
    });
    document.getElementById('cancel-branch-change').addEventListener('click', () => {
      document.getElementById('branch-change-box').style.display = 'none';
    });
    document.getElementById('confirm-branch-change').addEventListener('click', async () => {
      const newBranch = document.getElementById('new-branch-select').value;
      if(newBranch === p.branch){
        document.getElementById('branch-change-box').style.display = 'none';
        return;
      }
      const confirmBtn = document.getElementById('confirm-branch-change');
      confirmBtn.disabled = true; confirmBtn.textContent = 'جاري النقل...';
      try{
        await setDoc(doc(patientsCol(), p.id), { branch: newBranch }, { merge: true });
        const idx = patients.findIndex(x => x.id === p.id);
        if(idx > -1) patients[idx].branch = newBranch;
        openPatientDetail(p.id);
      }catch(err){
        console.error(err);
        alert('حصل خطأ أثناء النقل، حاولي تاني.');
        confirmBtn.disabled = false; confirmBtn.textContent = 'تأكيد النقل';
      }
    });
    document.getElementById('add-session-btn').addEventListener('click', () => openItemForm('session', patientId));
    document.getElementById('add-task-btn').addEventListener('click', () => openItemForm('task', patientId));

    detailScreen.querySelectorAll('[data-del-session]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.delSession;
        const item = sessionsCache[patientId].find(s => s.id === id);
        sessionsCache[patientId] = sessionsCache[patientId].filter(s => s.id !== id);
        openPatientDetail(patientId);
        showUndoToast('اتحذفت الجلسة', () => {
          sessionsCache[patientId].push(item);
          openPatientDetail(patientId);
        }, async () => {
          try{ await deleteDoc(doc(sessionsCol(patientId), id)); }
          catch(e){ console.error(e); alert('حصل خطأ أثناء الحذف الفعلي، ممكن الجلسة ترجع تظهر تاني.'); }
        });
      });
    });
    detailScreen.querySelectorAll('[data-del-task]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.delTask;
        const item = tasksCache[patientId].find(t => t.id === id);
        tasksCache[patientId] = tasksCache[patientId].filter(t => t.id !== id);
        openPatientDetail(patientId);
        showUndoToast('اتحذف التاسك', () => {
          tasksCache[patientId].push(item);
          openPatientDetail(patientId);
        }, async () => {
          try{ await deleteDoc(doc(tasksCol(patientId), id)); }
          catch(e){ console.error(e); alert('حصل خطأ أثناء الحذف الفعلي، ممكن التاسك يرجع يظهر تاني.'); }
        });
      });
    });
    detailScreen.querySelectorAll('[data-toggle-task]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.toggleTask;
        const task = tasksCache[patientId].find(t => t.id === id);
        if(task){
          const newStatus = task.status === 'done' ? 'pending' : 'done';
          try{
            await updateDoc(doc(tasksCol(patientId), id), { status: newStatus });
            task.status = newStatus;
          }catch(e){ alert('حصل خطأ في الحفظ، حاولي تاني.'); }
          openPatientDetail(patientId);
        }
      });
    });
  }

  // ---------- Patient add/edit form ----------
  const patientFormScreen = document.getElementById('patient-form-screen');

  function openPatientForm(existing, prefillBranch){
    patientFormScreen.style.display = 'flex';
    const isEdit = !!existing;
    const branchValue = existing ? existing.branch : prefillBranch;
    let loadedUpdatedAt = existing ? (existing.updatedAt || null) : null;
    patientFormScreen.innerHTML = `
      <div class="screen-header">
        <button class="icon-btn" id="back-from-pform">→</button>
        <h2>${isEdit ? 'تعديل بيانات الحالة' : 'إضافة حالة جديدة'}</h2>
      </div>
      <div class="screen-body">
        <form id="patient-form">
          <div class="field"><label>الاسم *</label><input type="text" id="f-name" required value="${existing ? esc(existing.name) : ''}"></div>
          <div class="field"><label>القسم / مكان المتابعة</label>
            <select id="f-branch">
              ${buildBranchOptionsHtml(branchValue)}
            </select>
          </div>
          <div class="field"><label>العمر</label><input type="number" id="f-age" value="${existing && existing.age ? esc(existing.age) : ''}"></div>
          <div class="field"><label>الجنس</label>
            <select id="f-gender">
              <option value="">اختاري</option>
              <option value="أنثى" ${existing && existing.gender==='أنثى'?'selected':''}>أنثى</option>
              <option value="ذكر" ${existing && existing.gender==='ذكر'?'selected':''}>ذكر</option>
            </select>
          </div>
          <div class="field"><label>رقم التليفون</label><input type="tel" id="f-phone" value="${existing && existing.phone ? esc(existing.phone) : ''}"><div id="phone-error" style="color:var(--rose); font-size:12px; margin-top:4px;"></div></div>
          <div class="field"><label>تاريخ أول جلسة</label><input type="date" id="f-startdate" value="${existing && existing.startDate ? existing.startDate : ''}"></div>
          <div class="field"><label>سبب المتابعة</label><input type="text" id="f-reason" value="${existing && existing.reason ? esc(existing.reason) : ''}"></div>
          <div class="field"><label>ملاحظات عامة</label><textarea id="f-notes">${existing && existing.notes ? esc(existing.notes) : ''}</textarea></div>
          <div class="field">
            <label>الحالة</label>
            <select id="f-active">
              <option value="true" ${!existing || existing.active!==false ? 'selected':''}>نشطة</option>
              <option value="false" ${existing && existing.active===false ? 'selected':''}>متوقفة</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="pform-submit">${isEdit ? 'حفظ التعديلات' : 'إضافة الحالة'}</button>
          </div>
          <div id="conflict-warning" style="display:none;" class="conflict-banner">
            <strong>تنبيه:</strong> البيانات دي اتعدّلت من جهاز تاني بعد ما فتحتيها إنتِ. لو كمّلتي الحفظ، تعديلاتك هتكتب فوق التعديل التاني.
            <div style="margin-top:8px; display:flex; gap:8px;">
              <button type="button" class="btn btn-danger" id="overwrite-anyway-btn" style="flex:1; padding:8px; font-size:13px;">أكتب فوقها برضو</button>
              <button type="button" class="btn btn-ghost" id="reload-fresh-btn" style="flex:1; padding:8px; font-size:13px;">حمّلي النسخة الجديدة</button>
            </div>
          </div>
          ${isEdit ? `<div class="form-actions"><button type="button" class="btn btn-danger" id="delete-patient-btn">حذف الحالة نهائيًا</button></div>` : ''}
        </form>
      </div>
    `;
    document.getElementById('back-from-pform').addEventListener('click', () => { patientFormScreen.style.display = 'none'; });
    document.getElementById('patient-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('f-name').value.trim();
      if(!name) return;
      const phoneVal = document.getElementById('f-phone').value.trim();
      const phoneErrorEl = document.getElementById('phone-error');
      phoneErrorEl.textContent = '';
      if(phoneVal && !/^[0-9+\s-]{7,20}$/.test(phoneVal)){
        phoneErrorEl.textContent = 'رقم التليفون لازم يكون أرقام بس (ممكن + في الأول).';
        return;
      }
      const submitBtn = document.getElementById('pform-submit');
      const conflictBox = document.getElementById('conflict-warning');
      const data = {
        name,
        branch: document.getElementById('f-branch').value,
        age: document.getElementById('f-age').value.trim(),
        gender: document.getElementById('f-gender').value,
        phone: phoneVal,
        startDate: document.getElementById('f-startdate').value,
        reason: document.getElementById('f-reason').value.trim(),
        notes: document.getElementById('f-notes').value.trim(),
        active: document.getElementById('f-active').value === 'true',
        updatedAt: Date.now()
      };
      submitBtn.disabled = true; submitBtn.textContent = 'جاري الحفظ...';
      try{
        if(isEdit){
          const freshSnap = await getDoc(doc(patientsCol(), existing.id));
          const freshUpdatedAt = freshSnap.exists() ? (freshSnap.data().updatedAt || null) : null;
          if(loadedUpdatedAt && freshUpdatedAt && freshUpdatedAt !== loadedUpdatedAt){
            conflictBox.style.display = 'block';
            submitBtn.disabled = false; submitBtn.textContent = 'حفظ التعديلات';
            return;
          }
          await setDoc(doc(patientsCol(), existing.id), data, { merge: true });
          const idx = patients.findIndex(p => p.id === existing.id);
          patients[idx] = { id: existing.id, ...data };
        } else {
          const ref = await addDoc(patientsCol(), data);
          patients.push({ id: ref.id, ...data });
        }
        patientFormScreen.style.display = 'none';
        if(existing){ openPatientDetail(existing.id); } else { renderPatientList(); }
      }catch(err){
        console.error(err);
        alert('حصل خطأ في الحفظ. تأكدي من الاتصال بالإنترنت وحاولي تاني.');
        submitBtn.disabled = false; submitBtn.textContent = isEdit ? 'حفظ التعديلات' : 'إضافة الحالة';
      }
    });
    if(isEdit){
      document.getElementById('overwrite-anyway-btn').addEventListener('click', async () => {
        loadedUpdatedAt = Date.now(); // bypass conflict check on next submit attempt
        document.getElementById('conflict-warning').style.display = 'none';
        document.getElementById('patient-form').requestSubmit();
      });
      document.getElementById('reload-fresh-btn').addEventListener('click', async () => {
        try{
          const freshSnap = await getDoc(doc(patientsCol(), existing.id));
          if(freshSnap.exists()){
            const freshData = { id: existing.id, ...freshSnap.data() };
            const idx = patients.findIndex(p => p.id === existing.id);
            if(idx > -1) patients[idx] = freshData;
            openPatientForm(freshData);
          }
        }catch(err){ alert('حصل خطأ في تحميل النسخة الجديدة.'); }
      });
    }
    if(isEdit){
      document.getElementById('delete-patient-btn').addEventListener('click', async () => {
        if(!confirm(`تأكيد حذف "${existing.name}" وكل بياناتها نهائيًا؟ ده مش هينفع يتراجع فيه.`)) return;
        try{
          const [sess, tks, assmts] = await Promise.all([getSessions(existing.id), getTasks(existing.id), getAssessments(existing.id)]);
          await Promise.all(sess.map(s => deleteDoc(doc(sessionsCol(existing.id), s.id))));
          await Promise.all(tks.map(t => deleteDoc(doc(tasksCol(existing.id), t.id))));
          await Promise.all(assmts.map(a => deleteDoc(doc(assessmentsCol(existing.id), a.id))));
          await deleteDoc(doc(patientsCol(), existing.id));
          patients = patients.filter(p => p.id !== existing.id);
          delete sessionsCache[existing.id];
          delete tasksCache[existing.id];
          delete assessmentsCache[existing.id];
          patientFormScreen.style.display = 'none';
          detailScreen.style.display = 'none';
          renderPatientList();
        }catch(err){
          console.error(err);
          alert('حصل خطأ أثناء الحذف، حاولي تاني.');
        }
      });
    }
  }

  // ---------- Session/Task add form ----------
  const itemFormScreen = document.getElementById('item-form-screen');

  function openItemForm(kind, patientId){
    itemFormScreen.style.display = 'flex';
    const today = new Date().toISOString().slice(0,10);
    if(kind === 'session'){
      itemFormScreen.innerHTML = `
        <div class="screen-header">
          <button class="icon-btn" id="back-from-iform">→</button>
          <h2>جلسة جديدة</h2>
        </div>
        <div class="screen-body">
          <form id="item-form">
            <div class="field"><label>تاريخ الجلسة *</label><input type="date" id="s-date" required value="${today}"></div>
            <div class="field"><label>المدة (دقيقة)</label><input type="number" id="s-duration" placeholder="50"></div>
            <div class="field"><label>نوع الجلسة</label>
              <select id="s-type">
                <option value="حضوري">حضوري</option>
                <option value="أونلاين">أونلاين</option>
              </select>
            </div>
            <div class="field"><label>سعر الجلسة (جنيه)</label><input type="number" id="s-amount" placeholder="300"></div>
            <div class="field"><label>ملاحظات الجلسة</label><textarea id="s-notes" placeholder="اللي اتناقشتوا فيه، ملاحظات المزاج، إلخ..."></textarea></div>
            <div class="field" style="display:flex; align-items:center; gap:8px; flex-direction:row-reverse; justify-content:flex-end;">
              <label style="margin:0;">الجلسة اتدفعت؟</label>
              <input type="checkbox" id="s-paid" style="width:20px; height:20px;">
            </div>
            <div class="form-actions"><button type="submit" class="btn btn-primary" id="iform-submit">حفظ الجلسة</button></div>
          </form>
        </div>
      `;
      document.getElementById('back-from-iform').addEventListener('click', () => { itemFormScreen.style.display = 'none'; });
      document.getElementById('item-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('iform-submit');
        submitBtn.disabled = true; submitBtn.textContent = 'جاري الحفظ...';
        const session = {
          date: document.getElementById('s-date').value,
          duration: document.getElementById('s-duration').value.trim(),
          type: document.getElementById('s-type').value,
          amount: document.getElementById('s-amount').value.trim(),
          notes: document.getElementById('s-notes').value.trim(),
          paid: document.getElementById('s-paid').checked
        };
        try{
          const ref = await addDoc(sessionsCol(patientId), session);
          if(!sessionsCache[patientId]) sessionsCache[patientId] = [];
          sessionsCache[patientId].push({ id: ref.id, ...session });
          itemFormScreen.style.display = 'none';
          openPatientDetail(patientId);
        }catch(err){
          console.error(err);
          alert('حصل خطأ في الحفظ. تأكدي من الاتصال بالإنترنت وحاولي تاني.');
          submitBtn.disabled = false; submitBtn.textContent = 'حفظ الجلسة';
        }
      });
    } else if(kind === 'task') {
      itemFormScreen.innerHTML = `
        <div class="screen-header">
          <button class="icon-btn" id="back-from-iform">→</button>
          <h2>تاسك جديد</h2>
        </div>
        <div class="screen-body">
          <form id="item-form">
            <div class="field"><label>وصف التاسك *</label><textarea id="t-desc" required placeholder="مثال: كتابة يوميات المشاعر لمدة أسبوع"></textarea></div>
            <div class="field"><label>مرتبط بجلسة (اختياري)</label>
              <select id="t-session">
                <option value="">بدون ربط بجلسة معينة</option>
                ${(sessionsCache[patientId]||[]).slice().sort((a,b)=> new Date(b.date||0)-new Date(a.date||0)).map(s => `<option value="${s.id}">${fmtDate(s.date)}${s.type ? ' - ' + esc(s.type) : ''}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>تاريخ التكليف</label><input type="date" id="t-assigned" value="${today}"></div>
            <div class="field"><label>تاريخ الاستحقاق</label><input type="date" id="t-due"></div>
            <div class="form-actions"><button type="submit" class="btn btn-primary" id="iform-submit">حفظ التاسك</button></div>
          </form>
        </div>
      `;
      document.getElementById('back-from-iform').addEventListener('click', () => { itemFormScreen.style.display = 'none'; });
      document.getElementById('item-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const desc = document.getElementById('t-desc').value.trim();
        if(!desc) return;
        const submitBtn = document.getElementById('iform-submit');
        submitBtn.disabled = true; submitBtn.textContent = 'جاري الحفظ...';
        const task = {
          description: desc,
          assignedDate: document.getElementById('t-assigned').value,
          dueDate: document.getElementById('t-due').value,
          sessionId: document.getElementById('t-session').value || '',
          status: 'pending'
        };
        try{
          const ref = await addDoc(tasksCol(patientId), task);
          if(!tasksCache[patientId]) tasksCache[patientId] = [];
          tasksCache[patientId].push({ id: ref.id, ...task });
          itemFormScreen.style.display = 'none';
          openPatientDetail(patientId);
        }catch(err){
          console.error(err);
          alert('حصل خطأ في الحفظ. تأكدي من الاتصال بالإنترنت وحاولي تاني.');
          submitBtn.disabled = false; submitBtn.textContent = 'حفظ التاسك';
        }
      });
    } else if(kind === 'assessment') {
      itemFormScreen.innerHTML = `
        <div class="screen-header">
          <button class="icon-btn" id="back-from-iform">→</button>
          <h2>مقياس نفسي جديد</h2>
        </div>
        <div class="screen-body">
          <form id="item-form">
            <div class="field"><label>اسم المقياس *</label><input type="text" id="a-name" required placeholder="مثال: مقياس بيك للاكتئاب"></div>
            <div class="field"><label>التاريخ</label><input type="date" id="a-date" value="${today}"></div>
            <div class="field"><label>النتيجة *</label><input type="text" id="a-score" required placeholder="مثال: 18"></div>
            <div class="field"><label>ملاحظات</label><textarea id="a-notes" placeholder="تفسير النتيجة أو أي ملاحظة"></textarea></div>
            <div class="form-actions"><button type="submit" class="btn btn-primary" id="iform-submit">حفظ المقياس</button></div>
          </form>
        </div>
      `;
      document.getElementById('back-from-iform').addEventListener('click', () => { itemFormScreen.style.display = 'none'; });
      document.getElementById('item-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('a-name').value.trim();
        const score = document.getElementById('a-score').value.trim();
        if(!name || !score) return;
        const submitBtn = document.getElementById('iform-submit');
        submitBtn.disabled = true; submitBtn.textContent = 'جاري الحفظ...';
        const assessment = {
          name,
          score,
          date: document.getElementById('a-date').value,
          notes: document.getElementById('a-notes').value.trim()
        };
        try{
          const ref = await addDoc(assessmentsCol(patientId), assessment);
          if(!assessmentsCache[patientId]) assessmentsCache[patientId] = [];
          assessmentsCache[patientId].push({ id: ref.id, ...assessment });
          itemFormScreen.style.display = 'none';
          openPatientDetail(patientId);
        }catch(err){
          console.error(err);
          alert('حصل خطأ في الحفظ. تأكدي من الاتصال بالإنترنت وحاولي تاني.');
          submitBtn.disabled = false; submitBtn.textContent = 'حفظ المقياس';
        }
      });
    }
  }
</script>
</body>
</html>
